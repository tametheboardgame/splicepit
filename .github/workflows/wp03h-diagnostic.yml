name: Temporary WP0.3H Diagnostic
on:
  push:
    branches: ['agent/wp0-3h-lab-experimentation-ux']
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run verify > wp03h-verify.log 2>&1
          status=$?
          {
            echo '## Temporary WP0.3H verification report'
            echo
            if [ "$status" -eq 0 ]; then echo '**Result: PASS**'; else echo '**Result: FAIL**'; fi
            echo
            echo '```text'
            tail -n 240 wp03h-verify.log
            echo '```'
          } > wp03h-body.md
          gh pr edit 15 --body-file wp03h-body.md
          exit "$status"
