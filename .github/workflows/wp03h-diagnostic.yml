name: Temporary WP0.3H Diagnostic
on:
  push:
    branches: ['agent/wp0-3h-lab-experimentation-ux']
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Verify, smoke and report
        env:
          GH_TOKEN: ${{ github.token }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          npm run verify > wp03h-verify.log 2>&1
          verify_status=$?
          if [ "$verify_status" -eq 0 ]; then
            npm run smoke > wp03h-smoke.log 2>&1
            smoke_status=$?
          else
            echo 'Smoke skipped because verify failed.' > wp03h-smoke.log
            smoke_status=1
          fi
          if [ "$verify_status" -eq 0 ] && [ "$smoke_status" -eq 0 ]; then status=0; else status=1; fi
          {
            echo '## Temporary WP0.3H verification report'
            echo
            if [ "$verify_status" -eq 0 ]; then echo '**Core verify: PASS**'; else echo '**Core verify: FAIL**'; fi
            if [ "$smoke_status" -eq 0 ]; then echo '**Browser smoke: PASS**'; else echo '**Browser smoke: FAIL**'; fi
            echo
            echo '### Verify tail'
            echo '```text'
            tail -n 120 wp03h-verify.log
            echo '```'
            echo
            echo '### Browser smoke'
            echo '```text'
            tail -n 160 wp03h-smoke.log
            echo '```'
          } > wp03h-body.md
          gh pr edit 15 --body-file wp03h-body.md
          exit "$status"
