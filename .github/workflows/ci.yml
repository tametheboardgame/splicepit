name: Verify SplicePit
on:
  push:
    branches: ['main', 'agent/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: splicepit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate content
        run: npm run validate:content
      - name: Validate RNG boundary
        run: npm run validate:rng
      - name: Validate YSP-3 Yard source
        run: npm run validate:ysp3
      - name: Validate RSP-3 Route source
        run: npm run validate:rsp3
      - name: Validate RSP-7 Dark Route source
        run: npm run validate:rsp7-dark
      - name: Validate RSP-7 tooling
        run: npm run validate:rsp7-tools
      - name: Validate RSP-8 tooling
        run: npm run validate:rsp8-tools
      - name: Unit, domain and save tests
        run: npm test
      - name: Production build
        run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Player-facing browser smoke
        run: npm run smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload RSP-8 visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp8-route-visual-acceptance-${{ github.sha }}
          path: artifacts/rsp8-route-visual-acceptance/
          if-no-files-found: warn
          retention-days: 14
