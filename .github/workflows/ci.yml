name: Verify SplicePit
on:
  push:
    branches: ['main', 'agent/**']
  pull_request:
permissions:
  contents: read
  statuses: write
concurrency:
  group: splicepit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending diagnostic status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'wp0.3g/diagnostic',
              description: 'Running repository verification'
            });
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate content
        run: npm run validate:content
      - name: Validate RNG boundary
        run: npm run validate:rng
      - name: Unit, domain and save tests
        run: npm test
      - name: Production build
        run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Player-facing browser smoke
        run: npm run smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
  publish-diagnostic-status:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke]
    steps:
      - name: Publish final diagnostic status
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SMOKE_RESULT: ${{ needs.browser-smoke.result }}
        with:
          script: |
            const passed = process.env.VERIFY_RESULT === 'success' && process.env.SMOKE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'wp0.3g/diagnostic',
              description: passed ? 'Full repository verification passed' : `verify=${process.env.VERIFY_RESULT}, smoke=${process.env.SMOKE_RESULT}`
            });
