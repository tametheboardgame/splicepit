name: WP0.3E Diagnostic
on:
  push:
    branches: ['agent/wp0.3e-cumulative-creature-biology']
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: wp0.3e-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: verify
        continue-on-error: true
        run: npm run verify > verify.log 2>&1
      - name: Publish readable diagnostic statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          STATE=failure
          [ "$RESULT" = "success" ] && STATE=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context='wp0.3e/verify' -f description="npm run verify: ${RESULT}"
          if [ "$STATE" = failure ]; then
            mapfile -t ERRORS < <(grep -E 'error TS[0-9]+:|not ok|AssertionError|ERR!|Error:' verify.log | head -5)
            if [ ${#ERRORS[@]} -eq 0 ]; then
              ERRORS=("$(tail -n 1 verify.log)")
            fi
            INDEX=1
            for LINE in "${ERRORS[@]}"; do
              DESC=$(printf '%s' "$LINE" | tr '\n' ' ' | cut -c1-135)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state=failure -f context="wp0.3e/error-${INDEX}" -f description="$DESC"
              INDEX=$((INDEX + 1))
            done
          fi
      - name: Report diagnostic result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          {
            echo "WP0.3E diagnostic result: **${RESULT}**"
            echo
            echo '<details><summary>npm run verify output</summary>'
            echo
            echo '```text'
            tail -c 50000 verify.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > diagnostic-comment.md
          gh pr comment 12 --body-file diagnostic-comment.md || true
      - name: Preserve failure state
        if: steps.verify.outcome != 'success'
        run: exit 1
