name: WP0.3E Diagnostic
on:
  push:
    branches: ['agent/wp0.3e-cumulative-creature-biology']
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: wp0.3e-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: verify
        continue-on-error: true
        run: npm run verify > verify.log 2>&1
      - name: Report diagnostic result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          {
            echo "WP0.3E diagnostic result: **${RESULT}**"
            echo
            echo '<details><summary>npm run verify output</summary>'
            echo
            echo '```text'
            tail -c 50000 verify.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > diagnostic-comment.md
          gh pr comment 12 --body-file diagnostic-comment.md
      - name: Preserve failure state
        if: steps.verify.outcome != 'success'
        run: exit 1
