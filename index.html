<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#181512" />
  <meta name="description" content="SplicePit - a compact animated mad-science creature-splicing RPG prototype." />
  <title>SplicePit</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    #game-status {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0c0c0b;
      color: #a79d88;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
    }
    #game-status[data-error="true"] { color: #d98b6d; }
  </style>
</head>
<body>
  <main id="shell">
    <header class="site-header">
      <div>
        <span class="eyebrow">FIT PIT LICENCE: SUSPENDED</span>
        <h1>SplicePit</h1>
      </div>
      <div class="build-mark">WP0.4C / VISUAL DIRECTION RESET</div>
    </header>
    <section id="game-wrap" aria-label="SplicePit game">
      <div id="game"><div id="game-status" role="status" aria-live="polite">STARTING SPLICEPIT LAB PREVIEW…</div></div>
      <noscript>SplicePit needs JavaScript enabled.</noscript>
    </section>
    <footer>
      <span>Move: Arrow keys / WASD</span>
      <span>Interact: E / Space</span>
      <span>Menu: Esc</span>
    </footer>
  </main>
  <script>
    (() => {
      const status = document.getElementById('game-status');
      const visualDirectionReview = new URLSearchParams(window.location.search).get('visualDirection') === '1';
      const expectedStartupScene = visualDirectionReview ? 'VisualDirection' : 'Title';
      let finished = false;
      let recoveryAttempted = false;
      const showFailure = (message) => {
        if (!status || finished) return;
        status.dataset.error = 'true';
        status.textContent = `GAME STARTUP ERROR: ${message}`;
      };

      window.addEventListener('error', (event) => {
        showFailure(event.message || 'JavaScript failed before the game could start.');
      });
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason instanceof Error ? event.reason.message : String(event.reason ?? 'Unhandled startup rejection.');
        showFailure(reason);
      });

      const monitor = window.setInterval(() => {
        const game = globalThis.__SPLICEPIT_GAME__;
        if (game?.scene?.isActive?.(expectedStartupScene)) {
          finished = true;
          window.clearInterval(monitor);
          status?.remove();
          return;
        }

        if (game && !recoveryAttempted) {
          const elapsed = performance.now();
          if (elapsed > 1800) {
            recoveryAttempted = true;
            try {
              game.scene.start(expectedStartupScene);
            } catch (error) {
              showFailure(`Recovery failed: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
        }
      }, 100);

      window.setTimeout(() => {
        if (finished) return;
        const game = globalThis.__SPLICEPIT_GAME__;
        const active = game?.scene?.getScenes?.(true)?.map?.((scene) => scene.scene?.key).join(',') || 'none';
        const known = game?.scene?.getScenes?.(false)?.map?.((scene) => scene.scene?.key).join(',') || 'none';
        const canvasCount = document.querySelectorAll('#game canvas').length;
        const booted = Boolean(game?.isBooted);
        const running = Boolean(game?.loop?.running);
        showFailure(`${expectedStartupScene} did not start. game=${Boolean(game)} booted=${booted} loop=${running} active=${active} known=${known} canvas=${canvasCount} visibility=${document.visibilityState}.`);
      }, 6000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
