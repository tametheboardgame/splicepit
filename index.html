<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#181512" />
  <meta name="description" content="SplicePit - a pastoral biotech creature-splicing RPG prototype." />
  <title>SplicePit</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="shell">
    <header class="site-header">
      <div>
        <span class="eyebrow">FIT PIT LICENCE: SUSPENDED</span>
        <h1>SplicePit</h1>
      </div>
      <div class="build-mark">R0.1 VERTICAL SLICE</div>
    </header>
    <section id="game-wrap" aria-label="SplicePit game">
      <div id="game"></div>
      <noscript>SplicePit needs JavaScript enabled.</noscript>
    </section>
    <footer>
      <span>Move: Arrow keys / WASD</span>
      <span>Interact: E / Space</span>
      <span>Menu: Esc</span>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
